<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6E9DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LUMINA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Mais que uma Bíblia, uma jornada com Deus. Leia, reflita, ore e anote.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>LUMINA · Mais que uma Bíblia, uma jornada com Deus</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Alegreya+Sans:wght@400;500;700&family=Jost:wght@400;500&family=Sacramento&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <main id="screen" class="screen"></main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="inicio"><i class="ico" data-icon="home"></i><span>Início</span></button>
      <button data-tab="biblia"><i class="ico" data-icon="book"></i><span>Bíblia</span></button>
      <button data-tab="planos"><i class="ico" data-icon="calendar"></i><span>Planos</span></button>
      <button data-tab="anotacoes"><i class="ico" data-icon="edit"></i><span>Anotações</span></button>
      <button data-tab="mais"><i class="ico" data-icon="menu"></i><span>Mais</span></button>
    </nav>
    <div id="sheet" class="sheet hidden"></div>
    <div id="toast" class="toast"></div>
  </div>
  <script src="icons.js"></script>
  <script src="books.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  </script>
</body>
</html>
